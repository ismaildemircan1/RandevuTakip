<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevu Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10 max-w-2xl">
        <h2 class="text-2xl font-bold text-center mb-6">Randevu Takip Sistemi</h2>
        <!-- Kullanıcı Giriş/Kayıt Formu -->
        <div id="authSection" class="bg-white p-6 rounded shadow-md mb-6">
            <h3 class="text-lg font-semibold mb-4" id="authTitle">Giriş Yap</h3>
            <div id="userInfo" class="hidden mb-4"></div>
            <!-- Giriş Formu -->
            <form id="loginForm" class="mb-4">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium">E-posta</label>
                    <input type="email" id="email" class="w-full p-2 border rounded" placeholder="E-posta" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium">Şifre</label>
                    <input type="password" id="password" class="w-full p-2 border rounded" placeholder="Şifre" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Giriş Yap</button>
            </form>
            <!-- Kayıt Formu -->
            <form id="registerForm" class="mb-4 hidden">
                <div class="mb-4">
                    <label for="registerEmail" class="block text-sm font-medium">E-posta</label>
                    <input type="email" id="registerEmail" class="w-full p-2 border rounded" placeholder="E-posta" required>
                </div>
                <div class="mb-4">
                    <label for="registerPassword" class="block text-sm font-medium">Şifre</label>
                    <input type="password" id="registerPassword" class="w-full p-2 border rounded" placeholder="Şifre (min 6 karakter)" required>
                </div>
                <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Kayıt Ol</button>
            </form>
            <p class="text-center">
                <a href="#" id="toggleAuth" class="text-blue-500 hover:underline">Kayıt Ol</a>
            </p>
            <button id="logoutButton" class="w-full bg-red-500 text-white p-2 rounded hover:bg-red-600 hidden">Çıkış Yap</button>
        </div>
        <!-- İçerik (Giriş yapılmadan gizli) -->
        <div id="contentSection" class="hidden">
            <!-- Randevu Oluşturma Formu -->
            <form id="appointmentForm" class="bg-white p-6 rounded shadow-md mb-6">
                <div class="mb-4">
                    <label for="patientName" class="block text-sm font-medium">Hasta Adı</label>
                    <input type="text" id="patientName" class="w-full p-2 border rounded" placeholder="Hasta Adı" required>
                </div>
                <div class="mb-4">
                    <label for="patientPhone" class="block text-sm font-medium">Telefon Numarası</label>
                    <input type="tel" id="patientPhone" class="w-full p-2 border rounded" placeholder="Örn: +905xxxxxxxxx" required>
                </div>
                <div class="mb-4">
                    <label for="patientAddress" class="block text-sm font-medium">Adres (Opsiyonel)</label>
                    <input type="text" id="patientAddress" class="w-full p-2 border rounded" placeholder="Adres">
                </div>
                <div class="mb-4">
                    <label for="appointmentTime" class="block text-sm font-medium">Randevu Zamanı</label>
                    <input type="datetime-local" id="appointmentTime" class="w-full p-2 border rounded" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Randevu Oluştur</button>
            </form>
            <!-- Randevu Düzenleme Formu -->
            <form id="editAppointmentForm" class="bg-white p-6 rounded shadow-md mb-6 hidden">
                <h3 class="text-lg font-semibold mb-4">Randevu Düzenle</h3>
                <input type="hidden" id="editAppointmentId">
                <div class="mb-4">
                    <label for="editPatientName" class="block text-sm font-medium">Hasta Adı</label>
                    <input type="text" id="editPatientName" class="w-full p-2 border rounded" placeholder="Hasta Adı" required>
                </div>
                <div class="mb-4">
                    <label for="editPatientPhone" class="block text-sm font-medium">Telefon Numarası</label>
                    <input type="tel" id="editPatientPhone" class="w-full p-2 border rounded" placeholder="Örn: +905xxxxxxxxx" required>
                </div>
                <div class="mb-4">
                    <label for="editPatientAddress" class="block text-sm font-medium">Adres (Opsiyonel)</label>
                    <input type="text" id="editPatientAddress" class="w-full p-2 border rounded" placeholder="Adres">
                </div>
                <div class="mb-4">
                    <label for="editAppointmentTime" class="block text-sm font-medium">Randevu Zamanı</label>
                    <input type="datetime-local" id="editAppointmentTime" class="w-full p-2 border rounded" required>
                </div>
                <div class="flex justify-between">
                    <button type="submit" class="bg-yellow-500 text-white p-2 rounded hover:bg-yellow-600">Kaydet</button>
                    <button type="button" id="cancelEdit" class="bg-gray-500 text-white p-2 rounded hover:bg-gray-600">İptal</button>
                </div>
            </form>
            <!-- Ödeme Formu -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold">Ödeme Onayı</h3>
                <form id="paymentForm" class="mt-2">
                    <input type="text" id="cardNumber" class="w-full p-2 border rounded mb-2" placeholder="Kart Numarası (Demo)" required>
                    <input type="number" id="paymentAmount" class="w-full p-2 border rounded mb-2" placeholder="Ödeme Tutarı (TL)" required>
                    <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Ödeme Yap</button>
                </form>
            </div>
            <!-- Hasta Arama -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold">Hasta Arama</h3>
                <input type="text" id="patientSearch" class="w-full p-2 border rounded mb-2" placeholder="Hasta adına göre ara">
            </div>
            <!-- Hasta Listesi -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold">Hasta Kayıtları</h3>
                <div id="patientList" class="patient-list"></div>
            </div>
            <!-- Randevu Listesi -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold">Randevular</h3>
                <div id="appointmentList" class="appointment-list"></div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
